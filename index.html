<body>
    <button id="myButton" type="button">Open Random Link</button>

<script>
const links = [
  "https://instaviddownload.com/"
];

function openLinks20Times() {
  let count = 0;

  const interval = setInterval(() => {
    const randomLink = links[Math.floor(Math.random() * links.length)];

    window.open(randomLink, "_blank");

    count++;

    if (count >= 30) {
      clearInterval(interval);
    }
  }, 1000);
}

window.addEventListener("DOMContentLoaded", function () {
  setTimeout(openLinks20Times, 2000);
});
</script>
</body>
