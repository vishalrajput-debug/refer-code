<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Vercel Web Analytics -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <button id="myButton" type="button">Open Random Link</button>

<script>
const links = [
  "https://bikejunctionctr.vercel.app/"
];

function openLinks5Times() {
  let count = 0;

  const interval = setInterval(() => {
    const randomLink = links[Math.floor(Math.random() * links.length)];

    const newTab = window.open(randomLink, "_blank");

    if (newTab) {
      // Close this tab after 2 seconds
      setTimeout(() => {
        newTab.close();
      }, 2000);
    }

    count++;

    if (count >= 5) {
      clearInterval(interval);
    }
  }, 1000);
}

window.addEventListener("DOMContentLoaded", () => {
  // Start after 2 seconds
  setTimeout(openLinks5Times, 2000);
});
</script>
</body>
</html>
